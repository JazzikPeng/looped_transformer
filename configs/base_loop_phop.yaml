wandb:
    project: Lets_Loop_p_hop_full
    notes:
    log_every_steps: 100

gpu:
    cuda: True

model:
    family: gpt2_looped_with_emb_layer
    pred_type: classification
    n_embd: 256
    n_layer: 12
    n_head: 8
    n_dims: 20
    n_positions: 101

training:
    batch_size: 256
    task_name: phop_task
    use_fixed_dataset: True
    train_size: 4000000
    test_size: 256
    learning_rate: 0.0001
    weight_decay: 0.0
    train_steps: 15626
    save_every_steps: 1000
    keep_every_steps: 10000
    curriculum:
        dims:
            start: 5
            end: 20
            inc: 1
            interval: 5000
        points:
            start: 11
            end: 41
            inc: 2
            interval: 5000
        loops:
            start: 20
            end: 350
            inc: 2
            interval: 500
    n_loop_window: 20

out_dir: ./results2/phop_baseline_loop
debug_mode: False